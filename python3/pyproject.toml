[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mbse-sysarch"
version = "0.1.0"
description = "System architectures as mbse-schemas data: modules, interfaces and ports, implementations whose instances interact through channels, and containers, hard and soft"
keywords = ["architecture", "interaction", "modules", "channels", "mbse", "sysml", "interface"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mbse-schemas>=0.22.0,<0.23"]

[project.optional-dependencies]
yaml = ["mbse-schemas[yaml]>=0.22.0,<0.23"]

[tool.setuptools.package-data]
"mbse.Architecture.Systems" = ["skill/*.md", "skill/references/*.md"]

[tool.setuptools.packages.find]
include = ["mbse*"]
namespaces = true

[dependency-groups]
dev = [
    "coverage[toml]>=7.10",
    "ipykernel>=7.3.0",
    "nbformat>=5.11.1",
    "nbmake>=1.5.5",
    "pytest>=9.1.1",
    "pyyaml>=6",
]

[tool.uv.sources]
mbse-schemas = { path = "../../mbse-schemas/python3", editable = true }  # the sibling checkout: ../mbse-basis/scripts/polyrepo.py

[tool.pytest.ini_options]
testpaths = ["tests", "tutorials"]
addopts = "--nbmake"

[tool.coverage.run]
source = ["mbse.Architecture.Systems"]
omit = ["*/mbse/Architecture/Systems/Conformance/*"]
branch = true
parallel = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
